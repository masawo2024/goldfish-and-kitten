        ctx.ellipse(cx, waterY, surfRx, 17, 0, 0.06, Math.PI - 0.06);
        ctx.stroke();

        // Subtle glass Fresnel rim glow around spherical wall
        traceBowlPath();
        const fresnel = ctx.createRadialGradient(cx, cy, r * 0.74, cx, cy, r + 4);
        fresnel.addColorStop(0, 'rgba(255, 255, 255, 0)');
        fresnel.addColorStop(0.84, 'rgba(210, 242, 255, 0.08)');
        fresnel.addColorStop(0.96, 'rgba(255, 255, 255, 0.28)');
        fresnel.addColorStop(1, 'rgba(255, 255, 255, 0.45)');
        ctx.fillStyle = fresnel;
        ctx.fill();

        // Crisp curved glass outline
        traceBowlPath();
        ctx.strokeStyle = theme.glassRim;
        ctx.lineWidth = 2.6;
        ctx.stroke();

        // Thick glossy flared top rim (front half)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.86)';
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.ellipse(cx, rimY, rimRx, 14, 0, 0, Math.PI);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(180, 224, 240, 0.45)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.ellipse(cx, rimY + 3, rimRx - 3, 13, 0, 0.1, Math.PI - 0.1);
        ctx.stroke();

        // Curved specular window reflection on the left shoulder of the bowl
        ctx.save();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.44)';
        ctx.beginPath();
        ctx.moveTo(cx - 118, cy - 68);
        ctx.quadraticCurveTo(cx - 152, cy - 10, cx - 132, cy + 56);
        ctx.quadraticCurveTo(cx - 120, cy + 58, cx - 114, cy + 44);
        ctx.quadraticCurveTo(cx - 129, cy - 8, cx - 100, cy - 58);
        ctx.closePath();
        ctx.fill();

        // Secondary sharp highlight glint above left shoulder
        ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
        ctx.beginPath();
        ctx.ellipse(cx - 96, cy - 94, 14, 6, -0.78, 0, Math.PI * 2);
        ctx.fill();

        // Subtle curved reflection on the right edge (catching kitten's side)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.beginPath();
        ctx.moveTo(cx + 128, cy - 42);
        ctx.quadraticCurveTo(cx + 148, cy + 8, cx + 130, cy + 62);
        ctx.quadraticCurveTo(cx + 122, cy + 60, cx + 120, cy + 50);
        ctx.quadraticCurveTo(cx + 134, cy + 8, cx + 118, cy - 36);
        ctx.closePath();
        ctx.fill();

        // Thick glass base refraction arc
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.ellipse(cx, baseY - 2, 76, 10, 0, 0.12, Math.PI - 0.12);
        ctx.stroke();
        ctx.restore();

        // Glass tap ripple rings (when kitten paws or user taps)
        for (const gt of glassTaps) {
          ctx.save();
          ctx.strokeStyle = `rgba(255, 255, 255, ${gt.alpha})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(gt.x, gt.y, gt.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = `rgba(210, 245, 255, ${gt.alpha * 0.6})`;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(gt.x, gt.y, gt.r * 0.58, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        ctx.restore();
      }

      // Draw the adorable Black Kitten sitting beside the goldfish bowl
      function drawBlackKitten(theme) {
        const breathe = Math.sin(elapsed * 2.5);
        const crouchOffset = kitten.crouch * 16;
        const leanX = -kitten.crouch * 14;

        // Core body anchor
        const bx = kitten.baseX;
        const by = kitten.baseY;

        // Head position shifts subtly forward & down when stalking/pawing
        const hx = 648 + leanX;
        const hy = 344 + crouchOffset + breathe * 1.6;
        kitten.headX = hx;
        kitten.headY = hy;

        ctx.save();

        // --- 1. Expressive Curling Tail (behind body, whipping playfully at tip) ---
        const tailBaseX = bx + 66;
        const tailBaseY = by - 16;
        const flick1 = Math.sin(kitten.tailPhase) * (10 + kitten.tailExcitement * 18);
        const flick2 = Math.sin(kitten.tailPhase - 1.05) * (16 + kitten.tailExcitement * 28);

        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        // Subtle rim highlight along tail
        ctx.strokeStyle = theme.catRim;
        ctx.lineWidth = 19;
        ctx.beginPath();
        ctx.moveTo(tailBaseX, tailBaseY);
        ctx.bezierCurveTo(
          tailBaseX + 58, tailBaseY + 12 + flick1 * 0.25,
          tailBaseX + 104, tailBaseY - 26 + flick1 * 0.65,
          tailBaseX + 90 + flick2 * 0.45, tailBaseY - 94 + flick2 * 0.28
        );
        ctx.stroke();

        // Velvet black tail core
        ctx.strokeStyle = theme.catFur;
        ctx.lineWidth = 16;
        ctx.beginPath();
        ctx.moveTo(tailBaseX, tailBaseY);
        ctx.bezierCurveTo(
          tailBaseX + 58, tailBaseY + 12 + flick1 * 0.25,
          tailBaseX + 104, tailBaseY - 26 + flick1 * 0.65,
          tailBaseX + 90 + flick2 * 0.45, tailBaseY - 94 + flick2 * 0.28
        );
        ctx.stroke();
        ctx.restore();

        // --- 2. Back / Far Front Paw (resting neatly on table) ---
        ctx.save();
        ctx.fillStyle = '#0e0f16';
        ctx.beginPath();
        ctx.ellipse(bx - 56, by - 5, 19, 10, -0.05, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // --- 3. Kitten Sitting Body & Cute Rounded Haunches ---
        ctx.save();
        const bodyGrad = ctx.createRadialGradient(bx - 16, by - 88, 12, bx + 16, by - 46, 125);
        bodyGrad.addColorStop(0, theme.catFurMid);
        bodyGrad.addColorStop(0.6, theme.catFur);
        bodyGrad.addColorStop(1, '#0b0c12');

        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        // Start at chest below neck
        ctx.moveTo(hx - 14, hy + 28);
        // Chest curve down to front legs
        ctx.quadraticCurveTo(bx - 62 + leanX * 0.5, by - 64, bx - 48, by - 4);
        // Bottom sitting contour along wooden table
        ctx.quadraticCurveTo(bx + 12, by + 6, bx + 68, by - 6);
        // Cute fluffy sitting haunch curving up the back
        ctx.bezierCurveTo(
          bx + 88, by - 42,
          bx + 70, by - 108 + crouchOffset * 0.5,
          hx + 24, hy + 18
        );
        ctx.closePath();
        ctx.fill();

        // Soft rim light along kitten's curved back & shoulder
        ctx.strokeStyle = theme.catRim;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(hx - 16, hy + 28);
        ctx.quadraticCurveTo(bx - 58 + leanX * 0.5, by - 64, bx - 48, by - 12);
        ctx.stroke();

        // Soft tucked hind paw silhouette on haunch
        ctx.fillStyle = '#1d202e';
        ctx.beginPath();
        ctx.ellipse(bx + 28, by - 8, 26, 12, -0.08, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = theme.catFur;
        ctx.beginPath();
        ctx.ellipse(bx + 28, by - 6, 24, 10, -0.08, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // --- 4. Red Japanese Collar & Little Golden Bell (赤い首輪と鈴) ---
        ctx.save();
        const neckX = hx + 2;
        const neckY = hy + 34;
        ctx.strokeStyle = '#c82b2b';
        ctx.lineWidth = 7.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(neckX - 24, neckY - 3);
        ctx.quadraticCurveTo(neckX - 4, neckY + 12, neckX + 24, neckY + 2);
        ctx.stroke();

        // Subtle gold highlight thread on collar
        ctx.strokeStyle = 'rgba(255, 212, 148, 0.5)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(neckX - 20, neckY - 2);
        ctx.quadraticCurveTo(neckX - 4, neckY + 10, neckX + 20, neckY + 1);
        ctx.stroke();

        // Swinging tiny golden bell
        const bellX = neckX - 16 + Math.sin(kitten.bellSwing) * 4;
        const bellY = neckY + 12 + Math.abs(Math.sin(kitten.bellSwing)) * 1.2;
        const bellGrad = ctx.createRadialGradient(bellX - 2, bellY - 2, 1, bellX, bellY, 7.5);
        bellGrad.addColorStop(0, '#fff2a6');
        bellGrad.addColorStop(0.55, '#f0b83a');
        bellGrad.addColorStop(1, '#a66d12');
        ctx.fillStyle = bellGrad;
        ctx.beginPath();
        ctx.arc(bellX, bellY, 6.8, 0, Math.PI * 2);
        ctx.fill();
        // Bell slit
        ctx.strokeStyle = '#5c3b08';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(bellX - 4, bellY + 2);
        ctx.lineTo(bellX + 3.5, bellY + 2);
        ctx.stroke();
        ctx.restore();

        // --- 5. Kitten Head, Expressive Ears, Huge Amber Eyes & Whiskers ---
        ctx.save();
        ctx.translate(hx, hy);
        ctx.rotate(kitten.headTilt);

        // Far Ear (Left ear, closer to bowl)
        const earRotL = -0.22 - kitten.crouch * 0.14 - kitten.earTwitchL * 0.24;
        ctx.save();
        ctx.translate(-24, -26);
        ctx.rotate(earRotL);
        ctx.fillStyle = theme.catFur;
        ctx.beginPath();
        ctx.moveTo(-14, 10);
        ctx.quadraticCurveTo(-18, -26, -2, -36);
        ctx.quadraticCurveTo(12, -20, 14, 8);
        ctx.closePath();
        ctx.fill();
        // Soft inner ear
        ctx.fillStyle = '#563c48';
        ctx.beginPath();
        ctx.moveTo(-8, 4);
        ctx.quadraticCurveTo(-10, -18, -2, -26);
        ctx.quadraticCurveTo(6, -14, 7, 4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Near Ear (Right ear)
        const earRotR = 0.26 + kitten.crouch * 0.08 + kitten.earTwitchR * 0.26;
        ctx.save();
        ctx.translate(22, -26);
        ctx.rotate(earRotR);
        ctx.fillStyle = theme.catFur;
        ctx.beginPath();
        ctx.moveTo(-14, 8);
        ctx.quadraticCurveTo(-6, -24, 6, -37);
        ctx.quadraticCurveTo(20, -18, 16, 12);
        ctx.closePath();
        ctx.fill();
        // Inner ear
        ctx.fillStyle = '#624351';
        ctx.beginPath();
        ctx.moveTo(-8, 5);
        ctx.quadraticCurveTo(-2, -16, 5, -26);
        ctx.quadraticCurveTo(12, -13, 9, 6);
        ctx.closePath();
        ctx.fill();
        // Rim light on ear edge
        ctx.strokeStyle = theme.catRim;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-11, -12);
        ctx.quadraticCurveTo(-2, -28, 6, -37);
        ctx.stroke();
        ctx.restore();

        // Round fluffy kitten head silhouette (with subtle cute cheek fluff)
        const headGrad = ctx.createRadialGradient(-16, -12, 6, 4, 2, 54);
        headGrad.addColorStop(0, theme.catFurMid);
        headGrad.addColorStop(0.68, theme.catFur);
        headGrad.addColorStop(1, '#0b0c12');
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.moveTo(0, -40);
        ctx.bezierCurveTo(32, -40, 48, -18, 46, 6);
        ctx.bezierCurveTo(45, 28, 24, 41, -4, 40);
        ctx.bezierCurveTo(-32, 39, -46, 26, -45, 6);
        ctx.bezierCurveTo(-45, -20, -28, -40, 0, -40);
        ctx.closePath();
        ctx.fill();

        // Delicate rim highlight on forehead/cheek facing the bright bowl
        ctx.strokeStyle = theme.catRim;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(-2, 0, 42, Math.PI * 0.78, Math.PI * 1.38);
        ctx.stroke();

        // Big Luminous Golden-Amber Kitten Eyes tracking the goldfish!
        const dxLook = kitten.lookX - hx;
        const dyLook = kitten.lookY - hy;
        const lookDist = Math.hypot(dxLook, dyLook) || 1;
        const gazeX = clamp((dxLook / lookDist) * 4.4, -4.4, 4.4);
        const gazeY = clamp((dyLook / lookDist) * 3.8, -3.6, 3.6);
        const blinkScaleY = Math.max(0.06, 1 - Math.sin(kitten.blinkProgress));

        function drawKittenEye(ex, ey, rx, ry) {
          ctx.save();
          ctx.translate(ex, ey);
          ctx.scale(1, blinkScaleY);

          // Luminous amber-gold iris gradient
          const irisGrad = ctx.createRadialGradient(0, 2, 2, 0, 0, ry * 1.15);
          irisGrad.addColorStop(0, '#fff4a8');
          irisGrad.addColorStop(0.42, '#f6be32');
          irisGrad.addColorStop(0.84, '#d97e12');
          irisGrad.addColorStop(1, '#7c3f05');

          ctx.fillStyle = irisGrad;
          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();

          // Clip iris for glossy pupil
          ctx.save();
          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          ctx.clip();

          // Big cute kitten pupil (round-oval, dilates when stalking!)
          const pupilRx = rx * kitten.pupilDilation;
          const pupilRy = ry * clamp(kitten.pupilDilation + 0.14, 0.62, 0.88);
          ctx.fillStyle = '#090a0f';
          ctx.beginPath();
          ctx.ellipse(gazeX, gazeY, pupilRx, pupilRy, 0, 0, Math.PI * 2);
          ctx.fill();

          // Twin sparkling catchlights
          ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
          ctx.beginPath();
          ctx.ellipse(gazeX - rx * 0.28, gazeY - ry * 0.34, rx * 0.26, ry * 0.22, -0.35, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
          ctx.beginPath();
          ctx.arc(gazeX + rx * 0.28, gazeY + ry * 0.28, rx * 0.11, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();

          // Crisp dark upper eyelid rim
          ctx.strokeStyle = '#07080d';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, Math.PI, Math.PI * 2);
          ctx.stroke();

          ctx.restore();
        }

        // 3/4 left-facing eye placement
        drawKittenEye(-25, 1, 9.6, 12.2);
        drawKittenEye(5, 3, 11.4, 12.8);

        // Tiny cute nose & ω mouth
        ctx.fillStyle = '#3b2c34';
        ctx.beginPath();
        ctx.moveTo(-15, 15);
        ctx.lineTo(-9, 15);
        ctx.lineTo(-12, 19.5);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(130, 124, 146, 0.65)';
        ctx.lineWidth = 1.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-12, 19.5);
        ctx.quadraticCurveTo(-16, 25, -21, 22);
        ctx.moveTo(-12, 19.5);
        ctx.quadraticCurveTo(-7, 25, -2, 22);
        ctx.stroke();

        // Delicate whiskers
        ctx.strokeStyle = theme.id === 'night' ? 'rgba(210, 225, 255, 0.38)' : 'rgba(235, 240, 250, 0.56)';
        ctx.lineWidth = 1.15;
        // Left whiskers (towards bowl)
        ctx.beginPath();
        ctx.moveTo(-30, 15); ctx.quadraticCurveTo(-48, 12, -62, 14);
        ctx.moveTo(-30, 19); ctx.quadraticCurveTo(-49, 20, -64, 24);
        ctx.moveTo(-28, 23); ctx.quadraticCurveTo(-44, 27, -56, 32);
        // Right whiskers
        ctx.moveTo(14, 17); ctx.quadraticCurveTo(36, 14, 54, 16);
        ctx.moveTo(15, 21); ctx.quadraticCurveTo(38, 22, 56, 26);
        ctx.moveTo(13, 25); ctx.quadraticCurveTo(32, 29, 48, 35);
        ctx.stroke();

        ctx.restore(); // end head transform

        // --- 6. Animated Near Front Paw (resting OR playfully pawing the glass bowl!) ---
        const shoulderX = bx - 38 + leanX * 0.7;
        const shoulderY = by - 88 + crouchOffset * 0.6;
        const restPawX = bx - 32;
        const restPawY = by - 2;

        // Target glass point on right wall of the goldfish bowl
        const targetGlassY = kitten.pawTargetY;
        const targetGlassX = BOWL.cx + bowlSliceRadius(targetGlassY) + 5;

        const p = kitten.pawProgress;
        // Lift in a cute playful arc
        const pawX = lerp(restPawX, targetGlassX, p);
        const pawY = lerp(restPawY, targetGlassY, p) - Math.sin(p * Math.PI) * 28;

        ctx.save();
        // Arm from shoulder to paw
        const elbowX = lerp(shoulderX, pawX, 0.45) + (1 - p) * 6;
        const elbowY = lerp(shoulderY, pawY, 0.55) + 18 * (1 - p * 0.5);

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = theme.catFur;
        ctx.lineWidth = 20;
        ctx.beginPath();
        ctx.moveTo(shoulderX, shoulderY);
        ctx.quadraticCurveTo(elbowX, elbowY, pawX, pawY);
        ctx.stroke();

        // Soft directional rim highlight on the bowl-facing edge of the arm
        ctx.strokeStyle = theme.catRim;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(shoulderX - 9, shoulderY + 2);
        ctx.quadraticCurveTo(elbowX - 9, elbowY, pawX - 9, pawY - 2);
        ctx.stroke();

        // Cute rounded mitten paw
        ctx.translate(pawX, pawY);
        ctx.rotate(lerp(0, 0.95, p));
        ctx.fillStyle = theme.catFur;
        ctx.beginPath();
        ctx.ellipse(-4, 0, 16, 11.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Show adorable tiny pink paw pads (肉球) when paw is raised toward the glass!
        if (p > 0.25) {
          const padAlpha = clamp((p - 0.25) / 0.5, 0, 0.92);
          ctx.fillStyle = `rgba(218, 128, 148, ${padAlpha})`;
          // Main pad
          ctx.beginPath();
          ctx.ellipse(-4, 2, 4.8, 3.6, 0, 0, Math.PI * 2);
          ctx.fill();
          // Tiny toe beans
          const beans = [[-10, -2.5], [-6.5, -5.2], [-1.5, -5.2], [2, -2.2]];
          for (const [bx2, by2] of beans) {
            ctx.beginPath();
            ctx.arc(bx2, by2, 2.0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();

        ctx.restore(); // end kitten
      }

      function render() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const theme = THEMES[themeIdx];

        drawBackground(theme, w, h);

        ctx.save();
        ctx.translate(viewOffX, viewOffY);
        ctx.scale(viewScale, viewScale);

        drawTableShadowsAndCaustics(theme);
        drawBowlBack(theme);
        drawPebbles();
        drawBowlContents();
        drawBowlFrontGlass(theme);
        drawBlackKitten(theme);

        ctx.restore();
      }

      function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
